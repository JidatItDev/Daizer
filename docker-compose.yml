version: "3.9"

services:
  server:
    build: ./server
    container_name: app_server
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    networks:
      - app_net

  client:
    build: ./client
    container_name: app_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app_net

networks:
  app_net:
